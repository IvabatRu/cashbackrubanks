[package]
name = "app"
version = "0.1.0"
description = "Справочник банковских кешбэков"
authors = ["Ivabat"]
license = ""
repository = "https://github.com/IvabatRu/cashbackrubanks"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Позволяет попросить Android открыть ссылку системой. Нужен для перехода
# в приложение банка: WebView внутри приложения сам такую схему не откроет.
tauri-plugin-opener = "2"
